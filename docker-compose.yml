services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tbforum
      POSTGRES_USER: tbforum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbforum}
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbforum"]
      interval: 10s
      timeout: 5s
      retries