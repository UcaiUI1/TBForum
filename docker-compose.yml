services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tbforum
      POSTGRES_USER: tbforum
      POSTGRES_PASSWORD: tbforum
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes: { pg-data: {} }
