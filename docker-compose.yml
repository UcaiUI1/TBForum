services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tbforum
      POSTGRES_USER: tbforum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbforum}
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbforum"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-tbforum_redis_dev}
    volumes: ["redis-data:/data"]
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-tbforum_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes: { pg-data: {}, redis-data: {} }
