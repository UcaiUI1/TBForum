spring:
  datasource:
    url: jdbc:h2:mem:tbforum_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: create-drop
    open-in-view: false
    properties.hibernate.format_sql: false
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
server.error.include-message: always
app.jwt.secret: test-secret-key-for-jwt-signing-must-be-long-enough-1234567890
app.jwt.expiration-hours: 1
app.rate-limit.enabled: false
