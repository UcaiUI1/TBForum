spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tbforum}
    username: ${DB_USERNAME:tbforum}
    password: ${DB_PASSWORD:tbforum}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
app.jwt.secret: ${JWT_SECRET}
app.jwt.expiration-hours: 24
app.public-base-url: ${PUBLIC_BASE_URL}
app.upload.max-file-size: ${UPLOAD_MAX_FILE_SIZE:2097152}
app.upload.max-width: ${UPLOAD_MAX_WIDTH:4096}
app.upload.max-height: ${UPLOAD_MAX_HEIGHT:4096}
app.upload.max-pixels: ${UPLOAD_MAX_PIXELS:16777216}
app.upload.max-user-storage: ${UPLOAD_MAX_USER_STORAGE:52428800}
app.upload.pending-ttl: ${UPLOAD_PENDING_TTL:24h}
app.upload.cleanup-interval: ${UPLOAD_CLEANUP_INTERVAL:1h}
app.upload.cleanup-batch-size: ${UPLOAD_CLEANUP_BATCH_SIZE:100}
app.upload.legacy-reconciliation-enabled: ${UPLOAD_LEGACY_RECONCILIATION_ENABLED:true}
app.upload.legacy-reconciliation-batch-size: ${UPLOAD_LEGACY_RECONCILIATION_BATCH_SIZE:200}
app.storage.local.dir: ${UPLOAD_DIR:uploads}
app.redis.enabled: ${REDIS_ENABLED:true}
app.redis.failure-cooldown: ${REDIS_FAILURE_COOLDOWN:30s}
server:
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: ${REDIS_ENABLED:true}
  metrics:
    tags:
      application: tbforum
