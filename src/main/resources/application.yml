spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/tbforum;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate.ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties.hibernate.format_sql: true
    properties.hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB
server.error.include-message: always
app.jwt.secret: ${JWT_SECRET:change-this-development-key-to-a-long-random-secret-123456789}
app.jwt.expiration-hours: 24
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.show-details: when-authorized
  health.redis.enabled: true
  metrics.tags.application: tbforum
